services:
  backend:
    build:
      context: ./server
    restart: unless-stopped
    env_file: .env
    volumes:
      - db_data:/data

  frontend:
    build:
      context: ./client
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - backend

volumes:
  db_data:
  n8n_data:
