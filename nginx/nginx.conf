events {
    worker_connections 1024;
}

http {
    # Logging
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # Internes Netz der Hochschule (VLAN Beschäftigte)
    # TODO: Subnetz eintragen, z.B. 10.20.30.0/24
    geo $is_internal {
        default           0;
        127.0.0.1         1;  # localhost (für lokale Tests)
        10.200.32.0/21    1;  # VLAN Beschäftigte HS-Mainz
    }

    # HTTP → HTTPS redirect + Let's Encrypt ACME challenge
    server {
        listen 80;
        server_name DEINE_DOMAIN;  # z.B. dashboard.hs-mainz.de

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS
    server {
        listen 443 ssl http2;
        server_name DEINE_DOMAIN;  # z.B. dashboard.hs-mainz.de

        ssl_certificate     /etc/letsencrypt/live/DEINE_DOMAIN/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/DEINE_DOMAIN/privkey.pem;

        # Moderne TLS-Einstellungen (BSI TR-02102-2)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # OCSP Stapling
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 8.8.8.8 8.8.4.4 valid=300s;
        resolver_timeout 5s;

        # Security-Header
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # Anmeldung — nur aus dem internen Netz erreichbar.
        # Deckt /api/auth/sign-in/email und künftige sign-in-Varianten ab.
        # ^~ hat Vorrang vor der Regex-Location ~ ^/(api|admin)/ weiter unten.
        location ^~ /api/auth/sign-in {
            if ($is_internal = 0) {
                return 403;
            }
            proxy_pass         http://backend:3000;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            add_header         Cache-Control "no-store" always;
        }

        # /login und /admin (Frontend-Routen) — nur intern
        location ~ ^/(login|admin) {
            if ($is_internal = 0) {
                return 403;
            }
            proxy_pass         http://frontend:80;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # Restliche API & Admin-Endpunkte → Backend
        location ~ ^/(api|admin)/ {
            proxy_pass         http://backend:3000;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # Frontend (React SPA) — öffentlich
        location / {
            proxy_pass         http://frontend:80;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }
}
